# Lược đồ trung gian (hợp đồng C8).
# Bảng nguồn và cột nguồn phải có thật trong dataset/; tệp sai thì từ chối phục vụ.
schema_kind: GAV
entities:
  - name: don_hang
    description: Một dòng cho mỗi đơn hàng
    source_tables:
      - olist_orders_dataset
      - olist_customers_dataset
    fields:
      - field_name: ma_don
        source_table: olist_orders_dataset
        source_column: order_id
        data_type: string
        loaded: true
      - field_name: ngay_dat
        source_table: olist_orders_dataset
        source_column: order_purchase_timestamp
        data_type: timestamp
        loaded: true
      - field_name: trang_thai
        source_table: olist_orders_dataset
        source_column: order_status
        data_type: string
        loaded: true
      - field_name: ma_khach
        source_table: olist_orders_dataset
        source_column: customer_id
        data_type: string
        loaded: true
      - field_name: bang_giao
        source_table: olist_customers_dataset
        source_column: customer_state
        data_type: string
        loaded: true
      - field_name: ngay_giao_thuc_te
        source_table: olist_orders_dataset
        source_column: order_delivered_customer_date
        data_type: timestamp
        loaded: true
      - field_name: ngay_giao_du_kien
        source_table: olist_orders_dataset
        source_column: order_estimated_delivery_date
        data_type: timestamp
        loaded: true
  - name: mat_hang
    description: Một dòng cho mỗi dòng hàng của đơn
    source_tables:
      - olist_order_items_dataset
    fields:
      - field_name: ma_don
        source_table: olist_order_items_dataset
        source_column: order_id
        data_type: string
        loaded: true
      - field_name: ma_san_pham
        source_table: olist_order_items_dataset
        source_column: product_id
        data_type: string
        loaded: true
      - field_name: so_thu_tu
        source_table: olist_order_items_dataset
        source_column: order_item_id
        data_type: integer
        loaded: true
      - field_name: gia
        source_table: olist_order_items_dataset
        source_column: price
        data_type: decimal
        loaded: true
      - field_name: gia_van_chuyen
        source_table: olist_order_items_dataset
        source_column: freight_value
        data_type: decimal
        loaded: true
  - name: san_pham
    description: Một dòng cho mỗi sản phẩm
    source_tables:
      - olist_products_dataset
    fields:
      - field_name: ma_san_pham
        source_table: olist_products_dataset
        source_column: product_id
        data_type: string
        loaded: true
      - field_name: ten_danh_muc
        source_table: olist_products_dataset
        source_column: product_category_name
        data_type: string
        loaded: true
